<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ورود نمایشی به پنل مدیریت بصیرت‌بان" />
  <title>ورود | بصیرت‌بان</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='12' width='64' height='64' fill='%230369a1'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='32' fill='white'%3Eب%3C/text%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ["Vazirmatn", "Tahoma", "sans-serif"] } } } };</script>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <div class="mx-auto grid min-h-screen max-w-6xl items-center gap-8 px-4 py-10 lg:grid-cols-2">
    <div>
      <a href="index.html" class="inline-flex items-center gap-3">
        <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-sky-700 text-xl font-extrabold text-white">ب</span>
        <span>
          <span class="block text-2xl font-extrabold text-sky-800">بصیرت‌بان</span>
          <span class="block text-sm font-semibold text-sky-600">BasiratBaan</span>
        </span>
      </a>
      <h1 class="mt-8 text-3xl font-extrabold">ورود به پنل مدیریت</h1>
      <p class="mt-3 text-slate-600">این صفحه فقط ظاهر ورود است. هر ایمیل و رمز غیرخالی شما را به داشبورد می‌برد؛ احراز هویت واقعی وجود ندارد.</p>
    </div>
    <form id="login-form" class="card p-8" novalidate>
      <label for="login-email" class="mb-1 block font-semibold">ایمیل</label>
      <input id="login-email" type="email" class="mb-4 w-full rounded-xl border border-slate-300 px-3 py-3" placeholder="manager@basiratbaan.ir" />
      <label for="login-password" class="mb-1 block font-semibold">رمز عبور</label>
      <input id="login-password" type="password" class="w-full rounded-xl border border-slate-300 px-3 py-3" placeholder="رمز نمایشی" />
      <p id="login-error" class="mt-2 hidden text-sm text-rose-600">ایمیل و رمز را وارد کنید.</p>
      <button type="submit" class="btn-touch mt-6 w-full rounded-xl bg-sky-700 py-3 font-bold text-white hover:bg-sky-800">ورود به داشبورد</button>
      <a href="index.html" class="btn-touch mt-3 inline-flex w-full justify-center rounded-xl border border-slate-300 py-3 font-semibold">بازگشت به لندینگ</a>
    </form>
  </div>
  <script src="assets/js/admin.js"></script>
</body>
</html>
